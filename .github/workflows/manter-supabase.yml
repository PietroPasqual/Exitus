name: Manter o Supabase acordado

# O plano gratuito do Supabase pausa o projeto depois de ~7 dias sem uso.
# Este agendamento faz uma consulta simples a cada 3 dias para ele continuar ativo.
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        run: |
          # Chave pública (a mesma do site, feita para ficar no navegador)
          URL="https://gixuipmmpzrkjgokbrzc.supabase.co/rest/v1/circulos?select=id&limit=1"
          KEY="sb_publishable_HXJJLlHO-Ox8hQLYaQlrRA_0zuPGdh2"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Resposta do Supabase: $code"
          test "$code" = "200"
